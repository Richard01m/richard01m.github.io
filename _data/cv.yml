    Experience:
      - company: HKUST (GZ)
        position: "CultureLens: Steerable Human-AI Video Storytelling"
        location: Guangzhou, China
        start_date: 2026-06
        end_date: 2026-09
        summary: >
          Advisor: Prof. Pan Hui. An interactive video generation workbench for steering
          cross-cultural translation through four transcreation modes: Literal, Analogy,
          Explanation, and Sensation. Creator and audience studies suggest it reduces mental
          demand versus a general-purpose LLM baseline and reduces stereotypical perception
          among Western audiences.

      - company: HKUST (GZ)
        position: "RepoDirector: Repository-Grounded Generative Video"
        location: Guangzhou, China
        start_date: 2026-03
        end_date: 2026-05
        summary: >
          Advisor: Prof. Anyi Rao. An integrated authoring system organized around a persistent,
          editable storyboard for open-source promotional videos. In a within-subjects study
          with 18 participants, it reduced NASA-TLX workload and raised mean SUS from 41.94 to 79.58
          relative to a fragmented toolchain.

      - company: HKUST (GZ)
        position: "GlyphFix: Repairing Garbled Text in AI-Generated Video"
        location: Guangzhou, China
        start_date: 2026-02
        end_date: 2026-05
        summary: >
          Advisor: Prof. Pan Hui. A mixed-initiative workflow for localized text repair that
          separates semantic content, spatial behavior, and visual appearance. In a study with
          16 participants, GlyphFix required 27.2% of the mean completion time of conventional workflows.

      - company: HKUST (GZ)
        position: "Fideli3D: Geometrically Consistent 3D Data Storytelling"
        location: Guangzhou, China
        start_date: 2026-01
        end_date: 2026-05
        summary: >
          Advisor: Prof. Pan Hui. A multi-agent framework that transforms narrative text into
          geometrically consistent 3D data videos through semantic, asset, configuration, and
          camera-optimization layers.

      - company: HKUST (GZ)
        position: "Ink Symphony: Calligraphy to Music in VR"
        location: Guangzhou, China
        start_date: 2026-01
        end_date: 2026-04
        summary: >
          Advisor: Prof. Kang Zhang. A VR approach that turns Chinese calligraphy into music,
          drawing on the classical story of Zhi Yin. Presented as a design exploration.

      - company: Shanghai University
        position: Human Preference Decoding via ERP Analysis
        location: Shanghai, China
        start_date: 2024-07
        end_date: 2024-12
        summary: >
          Advisor: Prof. Huiran Zhang. An ERP study of preference judgments using the early N1
          component and the late positive potential. Preprint: arXiv:2505.19879.

      - company: Shanghai University
        position: Neural Network Controller for Lake Water-Level Balance
        location: Shanghai, China
        start_date: 2024-01
        end_date: 2024-05
        summary: >
          Advisor: Prof. Liming Xin. A neural-network anti-interference controller for lake
          water-level balance, evaluated on a simulator of the Great Lakes system.
          DOI:10.1117/12.3035322.

